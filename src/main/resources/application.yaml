server:
  port: 8081

spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useUnicode=true&characterEncoding=utf-8&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  redis:
    host: 127.0.0.1
    port: 6379
    password: wzx1230.qqq
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段

rocketmq:
  name-server: 127.0.0.1:9876 # NameServer 地址
  producer:
    group: hmdp-producer-group
    send-message-timeout: 3000 # 消息发送超时时间，单位毫秒
    retry-times-when-send-failed: 3 # 同步发送失败后的重试次数
    retry-times-when-send-async-failed: 3 # 异步发送失败后的重试次数
    max-message-size: 4194304 # 消息最大大小，单位字节（4MB）

hmdp:
  mq:
    dlq-consumer-enabled: false # 完成 DLQ 故障测试后再开启
    processing-scan-enabled: false # 完成 PROCESSING 扫描测试后再开启
    processing-timeout-seconds: 300 # 超过 5 分钟仍未完成则进入核对
    processing-scan-interval-ms: 60000 # 每分钟扫描一次
    processing-scan-batch-size: 100 # 单次最多核对 100 个订单
    order-lock-wait-millis: 200 # 同一 orderId 锁的最长等待时间，失败后交给 RocketMQ 重试
    fault-injection:
      force-transaction-unknown-after-lua: false # 仅用于事务回查测试，正常运行必须保持为 false
      force-consumer-failure-before-db: false # 验证消费者重试与 DLQ，开启后每次消费都在数据库事务前失败
      force-consumer-failure-after-db-commit: false # 验证数据库已提交但 Redis SUCCESS 未写入时的幂等恢复

mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包

logging:
  level:
    com.hmdp: debug
  pattern:
    dateformat: mm:ss.SSS
